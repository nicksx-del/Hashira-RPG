<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personagens | Hashira Handbook</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Cinzel:wght@500;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/mobile.css">
    <style>
        :root {
            --bg: #0c0d12;
            --panel: rgba(18, 20, 29, 0.78);
            --panel-strong: rgba(24, 28, 40, 0.86);
            --line: rgba(255, 255, 255, 0.12);
            --text: #f3f4f7;
            --muted: #aab0bf;
            --wisteria: #8b5cf6;
            --water: #38bdf8;
            --flame: #fb7185;
            --gold: #fbbf24;
            --oni: #ef4444;
            --slayer: #34d399;
            --font-main: 'Outfit', sans-serif;
            --font-display: 'Cinzel', serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: var(--font-main);
            background:
                linear-gradient(115deg, rgba(56, 189, 248, 0.08), transparent 38%),
                linear-gradient(285deg, rgba(239, 68, 68, 0.08), transparent 34%),
                linear-gradient(to bottom, #10111a, #0a0b10 55%, #090a0f);
        }

        .scene {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 1.35rem;
            border-bottom: 1px solid var(--line);
            background: rgba(7, 8, 13, 0.74);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            min-width: 0;
        }

        .back-link {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--line);
            display: grid;
            place-items: center;
            color: var(--text);
            text-decoration: none;
            background: rgba(255, 255, 255, 0.02);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            min-width: 0;
        }

        .brand-logo {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .brand-title {
            margin: 0;
            font-family: var(--font-display);
            font-size: 1.02rem;
            letter-spacing: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-actions {
            display: flex;
            gap: 0.55rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .top-btn {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            padding: 0.55rem 0.78rem;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .top-btn.primary {
            border-color: rgba(139, 92, 246, 0.45);
            background: rgba(139, 92, 246, 0.18);
        }

        .content {
            width: min(1240px, 100%);
            margin: 0 auto;
            padding: 1.5rem 1.25rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .page-head {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            justify-content: space-between;
            gap: 0.8rem;
        }

        .page-head h1 {
            margin: 0;
            font-family: var(--font-display);
            font-size: clamp(1.6rem, 2.4vw, 2.35rem);
            line-height: 1.1;
            letter-spacing: 0;
        }

        .page-head p {
            margin: 0.3rem 0 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .slot-count {
            border: 1px solid rgba(251, 191, 36, 0.45);
            color: var(--gold);
            padding: 0.36rem 0.6rem;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 0.95rem;
        }

        .char-card {
            position: relative;
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            min-height: 360px;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
            cursor: pointer;
        }

        .char-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.24);
            box-shadow: 0 18px 34px rgba(0, 0, 0, 0.35);
        }

        .card-art {
            height: 58%;
            background-size: cover;
            background-position: center 20%;
            position: relative;
        }

        .card-art::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(8, 8, 12, 0.96), rgba(8, 8, 12, 0.2));
        }

        .race-chip,
        .delete-btn {
            position: absolute;
            z-index: 3;
            top: 0.65rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.28rem 0.5rem;
            font-size: 0.68rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .race-chip {
            left: 0.65rem;
        }

        .delete-btn {
            right: 0.65rem;
            color: #fecaca;
            border-color: rgba(239, 68, 68, 0.4);
            cursor: pointer;
        }

        .card-body {
            margin-top: -44px;
            position: relative;
            z-index: 2;
            padding: 0.9rem 0.95rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            flex: 1;
            background: linear-gradient(to bottom, rgba(16, 17, 24, 0.12), rgba(16, 18, 26, 0.95) 36%);
        }

        .char-name {
            margin: 0;
            font-family: var(--font-display);
            font-size: 1.28rem;
            line-height: 1.05;
            color: #fff;
            letter-spacing: 0;
        }

        .style-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.83rem;
            color: #d7d9e4;
            min-height: 24px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.45rem;
        }

        .meta-box {
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.42rem 0.5rem;
        }

        .meta-label {
            color: var(--muted);
            font-size: 0.67rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .meta-value {
            margin-top: 0.12rem;
            font-size: 0.86rem;
            font-weight: 700;
            color: #f4f5fa;
        }

        .enter-row {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #e5e7eb;
            font-size: 0.78rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 0.55rem;
        }

        .new-slot {
            min-height: 360px;
            border: 1px dashed rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            display: grid;
            place-items: center;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .new-slot:hover {
            border-color: rgba(139, 92, 246, 0.5);
            background: rgba(139, 92, 246, 0.12);
        }

        .new-slot h3 {
            margin: 0.55rem 0 0.1rem;
            font-family: var(--font-display);
            font-size: 1.2rem;
        }

        .new-slot p {
            margin: 0;
            color: var(--muted);
            font-size: 0.84rem;
        }

        .loading {
            border: 1px dashed var(--line);
            border-radius: 12px;
            padding: 1rem;
            color: var(--muted);
            text-align: center;
            font-size: 0.88rem;
        }

        @media (max-width: 860px) {
            .topbar {
                padding: 0.9rem 0.95rem;
            }

            .content {
                padding: 1.1rem 0.9rem 1.4rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .char-card,
            .new-slot {
                min-height: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="scene">
        <header class="topbar">
            <div class="topbar-left">
                <a href="index.html" class="back-link" aria-label="Voltar ao inicio">
                    <i data-lucide="arrow-left" size="18"></i>
                </a>
                <div class="brand">
                    <img src="assets/hashira-logo.png" class="brand-logo" alt="Hashira Handbook">
                    <h2 class="brand-title">Hashira Handbook</h2>
                </div>
            </div>
            <div class="top-actions">
                <button class="top-btn primary" type="button" onclick="window.location.href='create-character.html'">
                    <i data-lucide="user-plus" size="15"></i> Novo Cacador
                </button>
                <button class="top-btn" type="button" onclick="clearData()">
                    <i data-lucide="trash-2" size="15"></i> Limpar Slots
                </button>
            </div>
        </header>

        <main class="content">
            <section class="page-head">
                <div>
                    <h1>Selecione Seu Personagem</h1>
                    <p>Escolha sua ficha ativa e continue sua campanha.</p>
                </div>
                <div class="slot-count" id="slotCount">0 / 5 slots</div>
            </section>

            <section class="grid" id="charGrid">
                <div class="loading">Carregando personagens...</div>
            </section>
        </main>
    </div>

    <script src="js/auth_system.js"></script>
    <script>
        (function checkAuth() {
            if (typeof AuthSystem !== 'undefined') {
                AuthSystem.requireAuth();
            } else if (!localStorage.getItem('demonSlayerSession')) {
                window.location.href = 'login.html';
            }
        })();

        const MAX_SLOTS = 5;

        function migrateData() {
            let slots = JSON.parse(localStorage.getItem('demonSlayerSaveSlots') || '[]');
            const single = localStorage.getItem('demonSlayerChar');

            if (slots.length === 0 && single) {
                try {
                    const char = JSON.parse(single);
                    if (char && char.name) {
                        slots.push(char);
                        localStorage.setItem('demonSlayerSaveSlots', JSON.stringify(slots));
                    }
                } catch (e) { }
            }

            const oldArr = localStorage.getItem('demonSlayerAllChars');
            if (oldArr) {
                try {
                    const oldList = JSON.parse(oldArr);
                    if (Array.isArray(oldList) && oldList.length) {
                        oldList.forEach((c) => {
                            if (!slots.find((s) => s.id === c.id || s.name === c.name)) {
                                slots.push(c);
                            }
                        });
                        localStorage.setItem('demonSlayerSaveSlots', JSON.stringify(slots));
                    }
                    localStorage.removeItem('demonSlayerAllChars');
                } catch (e) { }
            }
        }

        function getRank(levelValue) {
            const level = parseInt(levelValue || 1, 10);
            if (level <= 1) return "Mizunoto";
            if (level <= 3) return "Mizunoe";
            if (level <= 5) return "Kanoto";
            if (level <= 7) return "Kanoe";
            if (level <= 9) return "Tsuchinoto";
            if (level <= 11) return "Tsuchinoe";
            if (level <= 13) return "Hinoto";
            if (level <= 16) return "Hinoe";
            if (level <= 19) return "Kinoe";
            return "Hashira";
        }

        function getStyleInfo(char) {
            const isOni = char.race === 'Oni';
            if (isOni) {
                return {
                    name: char.kekkijutsu || 'Arte de Sangue',
                    icon: 'moon-star',
                    color: '#ef4444'
                };
            }

            const rawStyle = typeof char.breathingStyle === 'object' && char.breathingStyle
                ? char.breathingStyle.id || char.breathingStyle.name
                : char.breathingStyle;

            const map = {
                water: { name: 'Respiracao da Agua', icon: 'droplets', color: '#38bdf8' },
                thunder: { name: 'Respiracao do Trovao', icon: 'zap', color: '#facc15' },
                flame: { name: 'Respiracao das Chamas', icon: 'flame', color: '#fb7185' },
                wind: { name: 'Respiracao do Vento', icon: 'wind', color: '#34d399' },
                beast: { name: 'Respiracao da Fera', icon: 'paw-print', color: '#a1a1aa' },
                stone: { name: 'Respiracao da Pedra', icon: 'mountain', color: '#d6d3d1' },
                serpent: { name: 'Respiracao da Serpente', icon: 'waves', color: '#86efac' },
                flower: { name: 'Respiracao das Flores', icon: 'flower-2', color: '#f9a8d4' }
            };

            if (rawStyle && map[String(rawStyle).toLowerCase()]) {
                return map[String(rawStyle).toLowerCase()];
            }

            if (typeof char.breathingStyle === 'object' && char.breathingStyle && char.breathingStyle.name) {
                return { name: char.breathingStyle.name, icon: 'swords', color: '#38bdf8' };
            }

            return { name: 'Sem Respiracao', icon: 'swords', color: '#aab0bf' };
        }

        function getCardImage(char) {
            if (char.avatar) return char.avatar;
            if (char.portrait) return char.portrait;
            return char.race === 'Oni' ? 'assets/NezukoKamado.png' : 'assets/Tanjirou_manga.png';
        }

        function readVital(char, keyA, keyB, fallback) {
            const value = Number(char[keyA] ?? char[keyB] ?? fallback);
            return Number.isFinite(value) ? value : fallback;
        }

        function renderChars() {
            migrateData();
            let list = [];
            try {
                list = JSON.parse(localStorage.getItem('demonSlayerSaveSlots') || '[]');
            } catch (e) {
                list = [];
            }

            const slots = list.slice(0, MAX_SLOTS);
            const grid = document.getElementById('charGrid');
            const slotCount = document.getElementById('slotCount');
            slotCount.textContent = `${slots.length} / ${MAX_SLOTS} slots`;
            grid.innerHTML = '';

            for (let i = 0; i < MAX_SLOTS; i += 1) {
                const char = slots[i];
                if (!char) {
                    const newSlot = document.createElement('article');
                    newSlot.className = 'new-slot';
                    newSlot.setAttribute('role', 'button');
                    newSlot.tabIndex = 0;
                    newSlot.onclick = () => window.location.href = 'create-character.html';
                    newSlot.onkeydown = (event) => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            window.location.href = 'create-character.html';
                        }
                    };
                    newSlot.innerHTML = `
                        <div>
                            <i data-lucide="plus-circle" size="42"></i>
                            <h3>Novo Personagem</h3>
                            <p>Forjar nova ficha</p>
                        </div>
                    `;
                    grid.appendChild(newSlot);
                    continue;
                }

                const isOni = char.race === 'Oni';
                const accent = isOni ? 'var(--oni)' : 'var(--slayer)';
                const raceLabel = isOni ? 'ONI' : 'CACADOR';
                const raceIcon = isOni ? 'ghost' : 'sword';
                const style = getStyleInfo(char);
                const hp = readVital(char, 'currentHP', 'hp', 10);
                const pe = readVital(char, 'pe', 'manualMaxPE', 1);
                const maxHP = readVital(char, 'manualMaxHP', 'hp', hp);
                const maxPE = readVital(char, 'manualMaxPE', 'pe', pe);

                const card = document.createElement('article');
                card.className = 'char-card';
                card.style.setProperty('--accent-local', accent);
                card.onclick = () => selectChar(i);
                card.innerHTML = `
                    <div class="card-art" style="background-image:url('${getCardImage(char)}')">
                        <span class="race-chip" style="color:${accent}">
                            <i data-lucide="${raceIcon}" size="12"></i> ${raceLabel}
                        </span>
                        <button class="delete-btn" type="button" title="Apagar personagem" onclick="event.stopPropagation(); deleteChar(${i});">
                            <i data-lucide="trash-2" size="13"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <h3 class="char-name">${char.name || 'Sem Nome'}</h3>
                        <div class="style-row" style="color:${style.color}">
                            <i data-lucide="${style.icon}" size="14"></i>
                            <span>${style.name}</span>
                        </div>
                        <div class="meta-grid">
                            <div class="meta-box">
                                <div class="meta-label">Rank</div>
                                <div class="meta-value">${getRank(char.level)}</div>
                            </div>
                            <div class="meta-box">
                                <div class="meta-label">Nivel</div>
                                <div class="meta-value">${Number(char.level || 1)}</div>
                            </div>
                            <div class="meta-box">
                                <div class="meta-label">HP</div>
                                <div class="meta-value">${hp}/${maxHP}</div>
                            </div>
                            <div class="meta-box">
                                <div class="meta-label">PE</div>
                                <div class="meta-value">${pe}/${maxPE}</div>
                            </div>
                        </div>
                        <div class="enter-row">
                            <span>Entrar na ficha</span>
                            <i data-lucide="arrow-right" size="14"></i>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            }

            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                lucide.createIcons();
            }
        }

        function selectChar(index) {
            const list = JSON.parse(localStorage.getItem('demonSlayerSaveSlots') || '[]');
            const char = list[index];
            if (!char) return;

            localStorage.setItem('demonSlayerChar', JSON.stringify(char));
            window.location.href = char.race === 'Oni' ? 'oni-dashboard.html' : 'dashboard.html';
        }

        function deleteChar(index) {
            if (!confirm('Deseja realmente apagar este personagem? Essa acao e irreversivel.')) return;
            const list = JSON.parse(localStorage.getItem('demonSlayerSaveSlots') || '[]');
            list.splice(index, 1);
            localStorage.setItem('demonSlayerSaveSlots', JSON.stringify(list));
            renderChars();
        }

        function clearData() {
            if (!confirm('Isso vai apagar todos os slots salvos. Continuar?')) return;
            localStorage.removeItem('demonSlayerSaveSlots');
            localStorage.removeItem('demonSlayerChar');
            renderChars();
        }

        window.clearData = clearData;
        window.selectChar = selectChar;
        window.deleteChar = deleteChar;

        window.addEventListener('DOMContentLoaded', renderChars);
    </script>
</body>

</html>
